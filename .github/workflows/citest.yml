name: citest

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  citest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup tmate session, see https://github.com/marketplace/actions/debugging-with-tmate
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: make test
        run: make test

      - name: make buildgrafanacompat (latest grafana)
        run: make buildgrafanacompat GRAFANA_COMPAT_TARGET=latest

      - name: make buildgrafanacompat (package.json grafana)
        run: |
          v=$(jq -r '.dependencies["@grafana/data"]' package.json | sed 's/^[~^]//')
          echo "checking compat against grafana $v (from package.json)"
          make buildgrafanacompat GRAFANA_COMPAT_TARGET="$v"

